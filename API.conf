/**
 * ============================================================================
 *  API.conf — Estrutura de Configuração das Integrações
 * ============================================================================
 *  Arquivo independente de configuração da área administrativa de APIs.
 *  NÃO armazene chaves, tokens ou segredos neste arquivo: ele define apenas o
